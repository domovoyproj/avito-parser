name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root container
        run: docker build -t avito-parser:ci .
      - name: Container readiness and user smoke
        run: |
          docker run -d --name avito-ci -p 8000:8000 avito-parser:ci
          test "$(docker exec avito-ci id -u)" = "10001"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 2
          done
          docker logs avito-ci
          exit 1
  panel-tests:
    name: Panel regression tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Check critical lint errors
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: Run offline regression suite
        env:
          PYTHONIOENCODING: utf-8
        run: python run_offline_tests.py

      - name: Audit runtime dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m pip_audit -r constraints.txt

# ==============================================================================
# NGINX CONFIGURATION FOR AVITO MAX PARSER (REVERSE PROXY & WEBSOCKETS)
# ==============================================================================
# Разместите данный файл в /etc/nginx/sites-available/avito-parser
# и создайте симлинк: sudo ln -s /etc/nginx/sites-available/avito-parser /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Замените на ваш домен или IP

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Files Cache (Optional Performance boost)
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Main Application & API
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support (Required for Live Logs & Real-time Monitor Stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy scraper operations
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

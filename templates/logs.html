{% extends "base.html" %}

{% block title %}Логи системы — Avito Data Terminal{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-5">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-white/[0.06]">
    <div>
      <div class="flex items-center gap-2.5">
        <h1 class="text-xl font-bold text-white tracking-tight">Системный Журнал и Логи</h1>
        <span class="text-xs font-mono px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">
          EVENT STREAM
        </span>
      </div>
      <p class="text-slate-400 text-xs mt-0.5">Потоковый мониторинг сетевых запросов, парсера и воркеров</p>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <button onclick="downloadLogsTxt()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-slate-300 border border-white/[0.08] transition flex items-center gap-1.5 font-mono">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>Экспорт (.txt)</span>
      </button>
      <button onclick="clearSystemLogs()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 hover:bg-rose-500/20 text-rose-400 border border-white/[0.08] transition flex items-center gap-1.5 font-mono">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span>Очистить</span>
      </button>
    </div>
  </div>

  <!-- CONTROLS TOOLBAR -->
  <div class="panel-card p-3.5 flex flex-wrap items-center justify-between gap-3 text-xs">
    
    <div class="flex flex-wrap items-center gap-3">
      <!-- Search inside logs -->
      <div class="relative w-64">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
          <i data-lucide="search" class="w-3.5 h-3.5"></i>
        </div>
        <input 
          type="text" 
          id="log-search-filter" 
          placeholder="Фильтр журнала..." 
          oninput="renderLogs()"
          class="w-full app-input pl-9 pr-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none font-mono"
        >
      </div>

      <!-- Level filter -->
      <div class="flex items-center gap-1 bg-[#090d16] p-1 rounded-lg border border-white/[0.06] font-mono">
        <button onclick="setLevelFilter('ALL')" id="lvl-all" class="px-2.5 py-1 rounded text-[10px] font-bold bg-blue-600 text-white">ВСЕ</button>
        <button onclick="setLevelFilter('INFO')" id="lvl-info" class="px-2.5 py-1 rounded text-[10px] font-bold text-slate-400 hover:text-white">INFO</button>
        <button onclick="setLevelFilter('WARNING')" id="lvl-warn" class="px-2.5 py-1 rounded text-[10px] font-bold text-slate-400 hover:text-white">WARN</button>
        <button onclick="setLevelFilter('ERROR')" id="lvl-err" class="px-2.5 py-1 rounded text-[10px] font-bold text-slate-400 hover:text-white">ERROR</button>
      </div>
    </div>

    <!-- Auto-scroll & Auto-refresh -->
    <div class="flex items-center gap-4 text-xs font-mono">
      <label class="flex items-center gap-1.5 cursor-pointer select-none text-slate-400">
        <input type="checkbox" id="auto-refresh-toggle" checked class="w-3.5 h-3.5 text-blue-600 rounded bg-slate-900 border-slate-700">
        <span class="text-[11px]">Авто-обновление (2с)</span>
      </label>

      <label class="flex items-center gap-1.5 cursor-pointer select-none text-slate-400">
        <input type="checkbox" id="auto-scroll-toggle" checked class="w-3.5 h-3.5 text-blue-600 rounded bg-slate-900 border-slate-700">
        <span class="text-[11px]">Авто-скролл</span>
      </label>
    </div>

  </div>

  <!-- TERMINAL LOG WINDOW -->
  <div class="terminal-window rounded-xl p-4 min-h-[520px] max-h-[680px] overflow-y-auto font-mono text-[11px] space-y-1" id="terminal-content">
    <div class="text-slate-500">// Ожидание потока событий...</div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
let rawLogs = [];
let activeLevelFilter = 'ALL';

async function fetchLogs() {
  try {
    const data = await apiFetch('/api/logs');
    rawLogs = data.logs || [];
    renderLogs();
  } catch (err) {
    console.error('Failed to fetch logs:', err);
  }
}

function setLevelFilter(lvl) {
  activeLevelFilter = lvl;
  ['all', 'info', 'warn', 'err'].forEach(k => {
    const el = document.getElementById(`lvl-${k}`);
    if (el) el.className = 'px-2.5 py-1 rounded text-[10px] font-bold text-slate-400 hover:text-white';
  });

  const activeBtn = document.getElementById(`lvl-${lvl.toLowerCase().substring(0, 4)}`) || document.getElementById('lvl-all');
  if (activeBtn) activeBtn.className = 'px-2.5 py-1 rounded text-[10px] font-bold bg-blue-600 text-white';

  renderLogs();
}

function renderLogs() {
  const container = document.getElementById('terminal-content');
  const searchText = (document.getElementById('log-search-filter').value || '').toLowerCase();
  const autoScroll = document.getElementById('auto-scroll-toggle').checked;

  let filtered = rawLogs;

  if (activeLevelFilter !== 'ALL') {
    filtered = filtered.filter(l => l.level === activeLevelFilter);
  }

  if (searchText) {
    filtered = filtered.filter(l => l.message.toLowerCase().includes(searchText) || l.name.toLowerCase().includes(searchText));
  }

  if (filtered.length === 0) {
    container.innerHTML = '<div class="text-slate-600">// Записи журнала отсутствуют</div>';
    return;
  }

  container.innerHTML = filtered.map(l => {
    let colorClass = 'text-slate-300';
    let badgeClass = 'bg-slate-900 text-slate-400 border border-slate-800';

    if (l.level === 'INFO') {
      colorClass = 'text-slate-200';
      badgeClass = 'bg-blue-500/10 text-blue-400 border border-blue-500/20';
    } else if (l.level === 'WARNING') {
      colorClass = 'text-amber-300';
      badgeClass = 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
    } else if (l.level === 'ERROR') {
      colorClass = 'text-rose-400 font-bold';
      badgeClass = 'bg-rose-500/10 text-rose-400 border border-rose-500/20';
    }

    return `
      <div class="flex items-start gap-2 hover:bg-white/[0.02] py-0.5 px-1.5 rounded transition font-mono leading-relaxed">
        <span class="text-slate-500 select-none text-[10px]">${l.timestamp}</span>
        <span class="px-1 py-0.2 rounded text-[9px] font-bold uppercase ${badgeClass} select-none">${l.level}</span>
        <span class="text-slate-500 text-[10px] select-none">[${l.name}]</span>
        <span class="flex-1 ${colorClass} break-all">${escapeHtml(l.message)}</span>
      </div>
    `;
  }).join('');

  if (autoScroll) {
    container.scrollTop = container.scrollHeight;
  }
}

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function clearSystemLogs() {
  try {
    await apiFetch('/api/logs', { method: 'DELETE' });
    rawLogs = [];
    renderLogs();
    showToast('Логи очищены', 'success');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function downloadLogsTxt() {
  const text = rawLogs.map(l => `[${l.timestamp}] [${l.level}] [${l.name}] ${l.message}`).join('\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `avito_terminal_logs_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function initLogsPage() {
  fetchLogs();
  setInterval(() => {
    const toggle = document.getElementById('auto-refresh-toggle');
    if (toggle && toggle.checked) {
      fetchLogs();
    }
  }, 2000);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initLogsPage);
} else {
  initLogsPage();
}
</script>
{% endblock %}
